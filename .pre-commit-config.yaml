# prek hooks (prek install; prek run --all-files). Only checks scoped to the staged files run at pre-commit: CSharpier on
# the staged C# files, the 150-character line check that catches the comments CSharpier does not wrap, the GDScript format
# and lint checks of the tools/ GDScript, and the Agent Mail guard. The warnings-as-errors builds of the solution and of
# the godot/ addon project join at pre-push. No hook runs a test suite: `run.ps1 test` runs by hand, and
# `run.ps1 format-check` checks the whole repo by hand.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # tests/fixtures/ holds Godot's exact output: no final newline, trailing spaces and raw control characters.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$|^tests/fixtures/'
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: '\.md$|^tests/fixtures/'
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '^tests/fixtures/'
      - id: check-added-large-files
        # metadata/godot-<minor>.json, the committed ClassDB dump, is about 1.9 MB.
        args: [--maxkb=4096]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: docs-lint
        name: docs-lint (fast)
        entry: pwsh -NoProfile -File tools/docs-lint.ps1
        language: system
        pass_filenames: false
        files: \.md$
      - id: csharpier
        name: csharpier check
        entry: dotnet csharpier check
        language: system
        pass_filenames: true
        types: [c#]
        exclude: ^spikes/
      - id: cs-line-length
        name: C# line length
        entry: uv run --quiet python tools/linelength.py
        language: system
        types: [c#]
        exclude: ^spikes/
      - id: dotnet-build
        name: dotnet build -warnaserror
        entry: pwsh -NoProfile -File run.ps1 build
        language: system
        pass_filenames: false
        files: \.(cs|csproj|props|slnx|editorconfig)$|^global\.json$
        stages: [pre-push]
      - id: godot-build
        name: dotnet build godot/ addon -warnaserror
        entry: pwsh -NoProfile -File run.ps1 godot-build
        language: system
        pass_filenames: false
        files: \.(cs|csproj|props|slnx|editorconfig)$|^global\.json$
        stages: [pre-push]
      - id: gdformat
        name: gdformat check
        entry: gdformat --check
        language: system
        files: ^tools/(metadata-dump|value-fixtures|scene-fixtures|export-probe)/.*\.gd$
      - id: gdlint
        name: gdlint
        entry: gdlint
        language: system
        files: ^tools/(metadata-dump|value-fixtures|scene-fixtures|export-probe)/.*\.gd$
      - id: agent-mail-guard
        name: agent-mail lease guard
        entry: pwsh -NoProfile -File tools/agent-mail-guard.ps1
        language: system
        pass_filenames: true
